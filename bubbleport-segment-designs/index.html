<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>泡泡星港 · 路段设计台</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"../bubbleport-demo/dist/vendor/three.module.js"}}</script></head><body>
<header><a href="./">BUBBLEPORT <span>COURSE ATELIER / 01</span></a><p>泡泡星港 · 首轮路段设计</p><span class="status">4 段独立样段 · 设计评审版</span></header>
<main><aside><div class="eyebrow">LOST MARBLES → 泡泡星港</div><h1>把每一段，<br>做成一次小冒险。</h1><p class="intro">宽阔的玩具赛道、能预判的机关节奏，以及看得见下一步的路线选择。</p><nav id="segments" aria-label="赛道段"></nav><div class="spec"><span>统一设计基准</span><strong>19.2 净宽 / 1.3 角色直径</strong><p>薄荷绿 · 象牙白 · 蜜桃色<br>入口、出口保留无机关缓冲</p></div><p class="boundary">本轮展示造型与关卡布局。动作仅用于预览机关节奏，未接入碰撞、角色操控或通关验证。</p></aside>
<section class="work"><div class="viewer"><canvas id="world" aria-label="可拖动旋转的赛道模型"></canvas><div class="viewbar"><button data-view="perspective" class="selected">立体</button><button data-view="top">俯视</button><button data-view="side">侧视</button><button data-view="detail" id="closeup" hidden>门组近看</button><button id="motion" aria-pressed="false">播放机关</button><button id="capture">导出图片</button></div><div class="stamp"><span id="type"></span><strong id="name"></strong><small id="tagline"></small></div><div class="legend"><i></i> IN 入口　→　OUT 出口 <span>拖动旋转 · 滚轮缩放</span></div></div>
<div id="appearance"><label class="pack-label">材质包 <select id="pack"><option value="v2">泡泡星港 · 优化版 V2</option><option value="v1">泡泡星港 · 初版 V1</option></select></label><details><summary>光影调节</summary><div class="light-settings"><label>曝光<output for="light-exposure"></output><input aria-label="曝光" id="light-exposure" name="exposure" type="range" min="0.3" max="2" step="0.05" value="1.05"></label><label>主光强度<output for="light-key"></output><input aria-label="主光强度" id="light-key" name="key" type="range" min="0" max="5" step="0.05" value="2.5"></label><label>主光方向<output for="light-angle"></output><input aria-label="主光方向" id="light-angle" name="angle" type="range" min="-180" max="180" step="1" value="-144"></label><label>补光强度<output for="light-fill"></output><input aria-label="补光强度" id="light-fill" name="fill" type="range" min="0" max="2" step="0.05" value="1"></label><label>环境反射<output for="light-reflection"></output><input aria-label="环境反射" id="light-reflection" name="reflection" type="range" min="0" max="2" step="0.05" value="0.55"></label><label>阴影浓度<output for="light-shadow"></output><input aria-label="阴影浓度" id="light-shadow" name="shadow" type="range" min="0" max="1" step="0.05" value="1"></label><button type="button">重置光影</button></div></details></div>
<article><div><span class="eyebrow">MODULE SPEC</span><h2 id="dimensions"></h2><p id="reference"></p></div><ol id="beats"></ol><p id="controls"></p></article></section></main><script type="module" src="viewer.mjs"></script></body></html>
