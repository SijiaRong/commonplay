 if(kind==='top'){

 }else{

 for(const xx of [box.min.x,box.max.x])for(const yy of [box.min.y,box.max.y])for(const zz of [box.min.z,box.max.z])corners.push(new THREE.Vector3(xx,yy,zz));

 ctx.strokeStyle='#d7d0c4';ctx.lineWidth=2;ctx.strokeRect(80,365,2670,2520);ctx.strokeRect(2820,365,1196,1160);ctx.strokeRect(2820,1640,1196,1245);
