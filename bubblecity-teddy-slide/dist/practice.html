<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f3e9"><link rel="icon" href="./bubble-city-icon.png"><title>泡泡星城 · 自由练习</title><link rel="stylesheet" href="./style.css"><script type="importmap">{"imports":{"three":"./vendor/three.js"}}</script><link rel="stylesheet" href="./slide/settings.css"><link rel="stylesheet" href="./game-glass.css"><link rel="stylesheet" href="./slide/character-picker.css?v=dock"></head><body>
<main id="stage" aria-label="角色三维练习场"></main>
<header><div class="brand glass"><img src="./bubble-city-logo.png" width="40" height="40" alt=""><div><small>BUBBLE CITY</small><h1>泡泡星城</h1></div></div><nav style="pointer-events:auto" class="glass"><a href="./" style="color:inherit;margin-right:12px">滑梯赛道</a><button id="reset" title="回到起点"><b>↺</b> 归位</button></nav></header>
<div class="readout glass"><i></i><span id="status" role="status">正在加载角色…</span></div>
<div class="practice-picker"><button id="choose-character" type="button" aria-haspopup="dialog" aria-controls="character-picker" class="glass" disabled><img src="./characters/teddy.jpg" alt=""><span>角色选择<strong id="character-name">缝线小熊</strong></span><b aria-hidden="true">›</b></button></div>
<dialog id="character-picker" aria-labelledby="character-title"><div class="picker-heading"><div><h2 id="character-title">角色选择</h2></div><button id="close-character-picker" type="button" aria-label="完成角色选择">完成</button></div><div id="character-options" class="character-options"></div><p id="character-status" role="status" aria-live="polite"></p></dialog>
<footer><div class="controls glass"><div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span>移动</span></div><em></em><div><kbd class="space">空格</kbd><span>跳跃</span></div></div><div class="touch"><div id="pad" aria-label="拖动控制方向" class="glass"><i></i></div><button id="leap" class="glass mint-action">跳跃</button></div></footer>
<script type="module" src="./game.js?v=dock"></script><svg width="0" height="0" aria-hidden="true" style="position:absolute;pointer-events:none"><defs id="lenses"></defs></svg><script src="./glass.js"></script></body></html>
