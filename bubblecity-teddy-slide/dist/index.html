npm run bubblecity</pre><p>同一 Wi-Fi 下的玩家打开终端显示的局域网地址，即可创建或加入房间。</p><form method="dialog"><button>关闭</button></form></dialog>

<footer><div class="keys glass"><span><kbd>A</kbd><kbd>D</kbd> 转向</span><span><kbd>W</kbd> 加速</span><span><kbd>S</kbd> 减速</span><span><kbd>空格</kbd> 跳跃</span></div><div class="pad"><div><button data-key="KeyA" aria-label="向左">◀</button><button data-key="KeyD" aria-label="向右">▶</button></div><div><button data-key="KeyS">减速</button><button data-key="KeyW">加速</button><button data-key="Space">跳跃</button></div></div></footer>
<section id="game-loading" aria-live="polite"><div><p>正在载入泡泡星城…</p><div class="loading-status"><span>载入进度</span><output id="loading-percent" aria-live="off">0%</output></div><progress id="loading-progress" max="100" value="0" aria-label="游戏载入进度"></progress><button hidden onclick="location.reload()">重新加载</button></div></section>
<script src="./loading-progress.js"></script>
<script type="module">
  const loading = document.querySelector('#game-loading');
  const progress = window.gameLoading;
  try {
    const {play} = await import('./slide/ride.js?v=progress2');
    progress.set('engine', 1);
    await play(progress);
    await new Promise(requestAnimationFrame);
    progress.finish();
    await new Promise(requestAnimationFrame);
    loading.remove();
  } catch (error) {
    console.error(error);
    loading.querySelector('p').textContent = '游戏加载失败，请检查网络后重试。';
    document.querySelector('#loading-progress').hidden = true;
    document.querySelector('.loading-status').hidden = true;
    loading.querySelector('button').hidden = false;
  }
</script><svg width="0" height="0" aria-hidden="true" style="position:absolute;pointer-events:none"><defs id="lenses"></defs></svg><script src="./glass.js"></script></body></html>
