<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#e9eee6"><meta name="description" content="泡泡星港微缩乐园，三类原创精确赛道的加宽试玩。"><title>泡泡星港 · 宽版赛道试玩</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><link rel="stylesheet" href="./game-glass.css"><link rel="preload" as="image" href="./loading-scene.webp"><link rel="stylesheet" href="./loading.css?v=2"></head><body>
<section id="game-loading" aria-live="polite"><div><p>正在载入泡泡星港…</p><progress id="loading-progress" aria-label="星港载入进度"></progress><button hidden onclick="location.reload()">重新加载</button></div></section>
<main id="game" inert>
<canvas id="world" aria-label="泡泡星港三维试玩场景"></canvas>
<header><a class="brand glass" href="./"><span class="planet">◒</span><span>BUBBLEPORT<small>泡泡星港 · 微缩乐园</small></span></a><div class="header-right"><span class="live"><i></i>轨道试验日</span><button id="view" class="glass">切换俯瞰</button><button id="pause" aria-label="暂停或继续" class="glass">暂停</button></div></header>
<aside class="station glass"><div class="eyebrow">BUBBLEPORT CIRCUIT</div><h1>泡泡<span>星港</span></h1>
<div class="course-tabs" role="group" aria-label="选择试玩路段"><button data-course="slalom" class="selected"><span>01</span>星尘绕行</button><button data-course="hammers"><span>02</span>月面摆锤</button><button data-course="loop"><span>03</span>轨道回环</button></div>
<div class="width-box"><div><span>路面通行宽度</span><strong id="width-value">19.2 <small>+20%</small></strong></div><div class="segmented" role="group" aria-label="赛道宽度"><button data-width="16">原宽 16</button><button data-width="19.2" class="selected">加宽 19.2</button></div><p id="course-hint">穿过六块错位胶囊，试试更从容的转向。</p></div>
<button class="primary glass mint-action" id="start">出发试玩 <span>↗</span></button><div class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 <b>·</b> <kbd>空格</kbd>跳跃 <b>·</b> <kbd>R</kbd>重来</div></aside>
<div class="play-hud glass" id="play-hud" hidden><div><span id="current-name">星尘绕行</span><strong id="timer">00.0<small>s</small></strong></div><div class="telemetry"><span><b id="speed">0</b> 速度</span><span><b id="hits">0</b> 碰撞</span><span><b id="falls">0</b> 跌落</span></div><button id="reset">回到起点 ↺</button></div>
<div class="route-note glass" id="route-note">左右拖动画面看全景 · 滚轮缩放</div>
<footer><span>精确路面与碰撞 / 三类独立测试站</span><span class="asset-status" id="asset-status">正在点亮星港…</span></footer>
<div class="toast glass" id="toast" role="status"></div>
<div class="touch-controls" aria-label="触屏操控"><div><button data-key="a" aria-label="向左" class="glass mint-action">←</button><button data-key="d" aria-label="向右" class="glass mint-action">→</button></div><div><button data-key="s" aria-label="减速后退" class="glass mint-action">↓</button><button data-key="w" aria-label="前进" class="glass mint-action">↑</button><button data-key=" " aria-label="跳跃" class="glass mint-action">跃</button></div></div>
<div id="finish" class="modal" hidden><div class="finish-card glass"><div class="eyebrow">A LITTLE GIANT LEAP</div><div class="finish-planet">✦</div><h2>漂亮的一程。</h2><p id="finish-result"></p><button id="next" class="primary glass mint-action">前往下一站 ↗</button><button id="again">再跑一次</button></div></div>
</main>
<script type="module">
  const loading = document.querySelector('#game-loading');
  try {
    await import('./game.mjs?v=2');
    const progress = document.querySelector('#loading-progress');
    progress.value = progress.max;
    await new Promise(requestAnimationFrame);
    document.querySelector('#game').inert = false;
    loading.remove();
  } catch (error) {
    console.error(error);
    loading.querySelector('p').textContent = '星港加载失败，请检查网络和浏览器的 WebGL 支持。';
    loading.querySelector('progress').hidden = true;
    loading.querySelector('button').hidden = false;
  }
</script><svg width="0" height="0" aria-hidden="true" style="position:absolute;pointer-events:none"><defs id="lenses"></defs></svg><script src="./glass.js"></script></body></html>
