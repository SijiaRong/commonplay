<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>泡泡星港 · 工作室</title>
<style>*{box-sizing:border-box}body{margin:0;background:#dfd2bd}canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}</style>
<canvas aria-label="泡泡星港空桌工作室，拖动旋转视角"></canvas>
<script type="module">
import * as THREE from '../vendor/three.module.js';
const canvas=document.querySelector('canvas');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(49,1,0.02,40);
const loader=new THREE.TextureLoader();
const [room,oak]=await Promise.all(['studio.jpg','oak.jpg'].map(url=>loader.loadAsync(url)));
room.colorSpace=oak.colorSpace=THREE.SRGBColorSpace;
room.mapping=THREE.EquirectangularReflectionMapping;
scene.background=room;
scene.backgroundRotation.y=1.18;
scene.environment=room;
scene.environmentRotation.y=1.18;
scene.environmentIntensity=0.55;
oak.wrapS=oak.wrapT=THREE.RepeatWrapping;
oak.anisotropy=renderer.capabilities.getMaxAnisotropy();
const wood=new THREE.MeshStandardMaterial({map:oak,color:0xe8c8a2,roughness:0.55});
const edge=new THREE.MeshStandardMaterial({color:0xa47850,roughness:0.62});
const box=(w,h,d,x,y,z,material)=>{
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  mesh.position.set(x,y,z);
  scene.add(mesh);
};
box(1.65,0.042,1.05,0,0.76,0,[edge,edge,wood,edge,edge,edge]);
for(const x of [-0.75,0.75])for(const z of [-0.45,0.45])box(0.065,0.74,0.065,x,0.37,z,edge);
box(1.54,0.075,0.94,0,0.705,0,edge);
scene.add(new THREE.HemisphereLight(0xfff2df,0xb59670,1.35));
const sun=new THREE.DirectionalLight(0xffe3ba,1.35);
sun.position.set(-3,4,1);
scene.add(sun);
let azimuth=0.14,elevation=0.32;
function render(){
  renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  const distance=1.05;
  camera.position.set(distance*Math.sin(azimuth)*Math.cos(elevation),0.88+distance*Math.sin(elevation),distance*Math.cos(azimuth)*Math.cos(elevation));
  camera.lookAt(0,0.88,0);
  renderer.render(scene,camera);
}
canvas.onpointerdown=e=>canvas.setPointerCapture(e.pointerId);
canvas.onpointermove=e=>{
  if(!canvas.hasPointerCapture(e.pointerId))return;
  azimuth-=0.006*e.movementX;
  elevation=Math.min(1.1,Math.max(0.12,elevation+0.004*e.movementY));
  render();
};
canvas.onpointerup=e=>canvas.releasePointerCapture(e.pointerId);
window.addEventListener('resize',render);
render();
document.documentElement.dataset.ready='true';
</script></html>
