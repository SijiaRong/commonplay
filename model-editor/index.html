<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,"><title>模型材质编辑器 · Commonplay</title><link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"../bubbleport-demo/dist/vendor/three.module.js"}}</script>
<header><strong><i>◈</i> Commonplay</strong><span class="divider"></span>模型材质编辑器<button id="export" disabled>↓　导出 GLB</button></header>
<main><aside><div class="libraryHead"><h2>模型库 <small id="count"></small></h2><input id="search" type="search" placeholder="搜索名称、路径或编号" aria-label="搜索模型"><select id="group" aria-label="模型分类"><option value="">全部分类</option></select></div><nav id="list" aria-label="模型列表"></nav></aside>
<section id="stage"><canvas></canvas><div class="title"><code id="mid"></code><h1 id="name">载入模型库…</h1><span id="version"></span></div><output id="message" role="status"></output><div class="toolbar"><span>拖动旋转 · 滚轮缩放</span><button id="frame">适配视图</button></div></section>
<aside class="inspector"><h2>材质检查器</h2><fieldset id="panel" disabled><label>材质槽<select id="slot"></select></label><label>替换材质<select id="preset"></select></label><hr><h3>表面参数</h3><label>基础颜色<input type="color" id="color"></label><label>粗糙度 <output id="roughnessValue"></output><input id="roughness" type="range" min="0" max="1" step=".01"></label><label>金属度 <output id="metalnessValue"></output><input id="metalness" type="range" min="0" max="1" step=".01"></label><hr><h3>纹理贴图</h3><label>贴图通道<select id="channel"></select></label><label>纹理资源<select id="texture"></select></label><img id="thumb" hidden alt="当前贴图预览"><div class="uv"><label>横向重复<input id="repeatX" type="number" min=".01" step=".1"></label><label>纵向重复<input id="repeatY" type="number" min=".01" step=".1"></label><label>旋转角度<input id="angle" type="number" step="1"></label></div><label class="upload">＋ 导入本地图片<input id="upload" type="file" accept="image/png,image/jpeg,image/webp"></label><hr><button id="reset">还原当前材质槽</button></fieldset><p id="saved" role="status"></p></aside></main>
<script type="module" src="editor.js"></script></html>
