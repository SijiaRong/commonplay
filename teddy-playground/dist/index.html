<!doctype html><html lang="zh-CN"><!-- Course geometry baked from the locally analyzed Lost Marbles StageBuilder and CourseView by Meticulai. Play room panorama: Empty Play Room, Greg Zaal and Jarod Guest / Poly Haven (CC0). --><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#fcf2db"><title>泡泡星城 · Commonplay</title><link rel="stylesheet" href="./slide/slide.css"><script type="importmap">{"imports":{"three":"./slide/film/three.module.js","three/addons/":"./slide/film/addons/"}}</script><link rel="stylesheet" href="./loading.css"><link rel="preload" as="image" href="./loading-scene.webp"></head><body><section id="game-loading" aria-live="polite"><div><p>正在载入泡泡星城…</p><progress id="loading-progress" max="4" aria-label="游戏载入进度"></progress><button hidden onclick="location.reload()">重新加载</button></div></section>
<div id="game" inert>
<main id="world" aria-label="小熊的木制滑梯赛道"></main>
<header><div class="logo"><i aria-hidden="true">✳</i><div><small>COMMONPLAY</small><h1>泡泡星城</h1></div></div><nav><a href="./practice.html">自由练习</a><button id="reset" aria-label="重新开始">↺<span> 重来</span></button></nav></header>
<aside id="progress"><div><strong id="section">起点</strong><output id="percent">0%</output></div><progress max="100" value="0" aria-label="赛道进度"></progress></aside>
<section id="launch"><div class="character-summary"><span id="character-name">缝线小熊</span><button id="choose-character" type="button" aria-haspopup="dialog" aria-controls="character-picker">换个人物</button></div><p id="result" aria-live="polite"></p><button id="go" disabled>正在准备滑梯…</button></section>
<dialog id="character-picker" aria-labelledby="character-title"><div class="picker-heading"><div><small>TOY TOWN</small><h2 id="character-title">选个伙伴去滑梯</h2></div><button id="close-character-picker" type="button" aria-label="关闭人物选择">×</button></div><div id="character-options" class="character-options"></div><p id="character-status" role="status" aria-live="polite"></p></dialog>
<footer><div class="keys"><span><kbd>A</kbd><kbd>D</kbd> 转向</span><span><kbd>W</kbd> 加速</span><span><kbd>S</kbd> 减速</span><span><kbd>空格</kbd> 跳跃</span></div><div class="pad"><div><button data-key="KeyA" aria-label="向左">◀</button><button data-key="KeyD" aria-label="向右">▶</button></div><div><button data-key="KeyS">减速</button><button data-key="KeyW">加速</button><button data-key="Space">跳跃</button></div></div></footer>
</div>
<script type="module">
  const loading = document.querySelector('#game-loading');
  const progress = document.querySelector('#loading-progress');
  try {
    const {play} = await import('./slide/ride.js');
    progress.value = 1;
    await play(progress);
    progress.value = progress.max;
    await new Promise(requestAnimationFrame);
    document.querySelector('#game').inert = false;
    loading.remove();
  } catch (error) {
    console.error(error);
    loading.querySelector('p').textContent = '游戏加载失败，请检查网络后重试。';
    progress.hidden = true;
    loading.querySelector('button').hidden = false;
  }
</script></body></html>
