<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>泡泡星港 · 材质实验台</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"../bubbleport-demo/dist/vendor/three.module.js","three/addons/":"./vendor/"}}</script></head><body>
<header><div class="brand">BUBBLEPORT <span>MATERIAL STUDY / 02</span></div><div class="heading">泡泡星港 <span>材质实验台</span></div><div class="environment" aria-label="光照环境"><button data-mode="studio" aria-pressed="true">日间工作室</button><button data-mode="night" aria-pressed="false">暖光夜航</button></div></header>
<main><section class="stage"><div class="canvas-wrap"><canvas id="world" aria-label="可旋转查看的材质样品"></canvas><div id="pins"></div><div class="intro"><span>RESIN / METAL / LIGHT</span><h1>先看材料，再造星港。</h1><p>亮面路面与乳浊软胶 · 清漆、散射与回弹对照。</p></div><div class="views"><button data-view="overview" aria-pressed="true">全览</button><button data-view="top" aria-pressed="false">俯视</button><button data-view="detail" aria-pressed="false">近看样品</button><button id="compare" aria-pressed="false">旧参数对照</button><button id="capture">导出画面</button></div><div class="scene-note"><span id="mode-note">中性反射环境 · 暖色主光</span><span>拖动旋转 / 滚轮缩放 / 点击编号选材质</span></div></div><nav id="swatches" aria-label="材质选择"></nav></section>
<aside><span class="eyebrow">SELECTED MATERIAL</span><div class="selected-heading"><span id="selected-number">01</span><h2 id="selected-name"></h2></div><p id="selected-desc"></p><div class="usage"><span>适用部位</span><strong id="selected-use"></strong></div><div id="parameters"></div><button id="reset" class="reset">还原该材质</button><div class="light-options"><h3>软胶与成像</h3><label><span>软胶背光散射</span><input id="scatter" type="checkbox" checked></label><label><span>软垫挤压回弹</span><input id="soft-motion" type="checkbox" checked></label><label><span>发光灯</span><input id="lamps" type="checkbox" checked></label><label><span>灯光照到路面</span><input id="spill" type="checkbox" checked></label><label><span>Bloom 光晕</span><input id="bloom" type="checkbox" checked></label><label class="exposure"><span>画面曝光 <output id="exposure-value">1.00</output></span><input id="exposure" type="range" min="0.5" max="1.5" step="0.05" value="1"></label></div><p class="hint">透明样品下方和背后放有深浅底纹，可观察透色与折射。金属的亮暗来自反射环境；灯芯、地面照明与光晕可分开检查。</p></aside></main><script type="module" src="lab.mjs"></script></body></html>
